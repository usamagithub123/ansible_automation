---
- name: Patch EC2 servers from ServiceNow CR
  hosts: patch_targets
  become: yes
  serial: 1
  gather_facts: yes

  vars_files:
    - ../inventory/group_vars/all.yml

  tasks:

    - name: Show current target
      debug:
        msg: "Starting patching on {{ inventory_hostname }} for CR {{ hostvars['localhost']['cr_number'] }}"

    - name: Get current server time
      command: date +"%H:%M"
      register: current_time
      changed_when: false

    - name: Stop if outside maintenance window
      fail:
        msg: "Outside maintenance window. Current time {{ current_time.stdout }}, allowed {{ hostvars['localhost']['maintenance_start'] }} to {{ hostvars['localhost']['maintenance_end'] }}"
      when: current_time.stdout < hostvars['localhost']['maintenance_start'] or current_time.stdout > hostvars['localhost']['maintenance_end']

    - name: Check if inventory host is private IP
      set_fact:
        target_is_private_ip: "{{ inventory_hostname is match('^(10\\.|172\\.(1[6-9]|2[0-9]|3[0-1])\\.|192\\.168\\.)') }}"

    - block:

        - name: Get EC2 instance details using private IP
          amazon.aws.ec2_instance_info:
            region: "{{ aws_region }}"
            filters:
              private-ip-address: "{{ inventory_hostname }}"
          delegate_to: localhost
          become: false
          register: ec2_info_private
          when: target_is_private_ip | bool

        - name: Get EC2 instance details using public IP
          amazon.aws.ec2_instance_info:
            region: "{{ aws_region }}"
            filters:
              ip-address: "{{ inventory_hostname }}"
          delegate_to: localhost
          become: false
          register: ec2_info_public
          when: not target_is_private_ip | bool

        - name: Set final EC2 instance info
          set_fact:
            ec2_info: "{{ ec2_info_private if target_is_private_ip | bool else ec2_info_public }}"

        - name: Fail if EC2 instance not found
          fail:
            msg: "No EC2 instance found for IP {{ inventory_hostname }} in region {{ aws_region }}"
          when: ec2_info.instances | length == 0

        - name: Set EC2 details
          set_fact:
            ec2_instance_id: "{{ ec2_info.instances[0].instance_id }}"
            ec2_subnet_id: "{{ ec2_info.instances[0].subnet_id }}"
            ec2_instance_type: "{{ ec2_info.instances[0].instance_type }}"
            ec2_key_name: "{{ ec2_info.instances[0].key_name }}"
            ec2_security_group_id: "{{ ec2_info.instances[0].security_groups[0].group_id }}"

        - name: Create AMI backup before patching
          amazon.aws.ec2_ami:
            instance_id: "{{ ec2_instance_id }}"
            name: "prepatch-{{ hostvars['localhost']['cr_number'] }}-{{ inventory_hostname }}-{{ ansible_date_time.date }}-{{ ansible_date_time.time | replace(':','') }}"
            description: "Pre-patch backup for {{ inventory_hostname }} from {{ hostvars['localhost']['cr_number'] }}"
            region: "{{ aws_region }}"
            wait: "{{ ami_wait | default(false) }}"
            no_reboot: yes
            tags:
              Name: "PrePatchBackup-{{ inventory_hostname }}"
              ChangeRequest: "{{ hostvars['localhost']['cr_number'] }}"
              CreatedBy: "Ansible"
              Purpose: "Rollback"
          delegate_to: localhost
          become: false
          register: ami_backup

        - name: Update CR work notes - AMI created
          uri:
            url: "{{ snow_instance }}/api/now/table/change_request/{{ hostvars['localhost']['cr_sys_id'] }}"
            method: PATCH
            user: "{{ snow_username }}"
            password: "{{ snow_password }}"
            force_basic_auth: yes
            validate_certs: yes
            headers:
              Content-Type: "application/json"
              Accept: "application/json"
            body_format: json
            body:
              work_notes: |
                AMI backup created before patching.

                Server: {{ inventory_hostname }}
                Instance ID: {{ ec2_instance_id }}
                AMI ID: {{ ami_backup.image_id }}
          delegate_to: localhost
          become: false

        #################################################################
        # PRE HEALTH CHECK
        #################################################################

        - name: Pre health check - CPU usage percentage
          shell: "vmstat 1 2 | tail -1 | awk '{print 100 - $15}'"
          register: pre_cpu
          changed_when: false

        - name: Pre health check - Memory usage percentage
          shell: "free | awk '/Mem:/ {printf \"%.2f\", $3/$2 * 100}'"
          register: pre_memory
          changed_when: false

        - name: Pre health check - Disk usage percentage for root
          shell: "df -P / | awk 'NR==2 {gsub(\"%\", \"\", $5); print $5}'"
          register: pre_disk
          changed_when: false

        - name: Pre health check - Uptime
          command: uptime -p
          register: pre_uptime
          changed_when: false

        - name: Pre health check - Kernel version
          command: uname -r
          register: pre_kernel
          changed_when: false

        - name: Store pre health values
          set_fact:
            pre_health:
              cpu: "{{ pre_cpu.stdout | default('0') }}"
              memory: "{{ pre_memory.stdout | default('0') }}"
              disk: "{{ pre_disk.stdout | default('0') }}"
              uptime: "{{ pre_uptime.stdout | default('N/A') }}"
              kernel: "{{ pre_kernel.stdout | default('N/A') }}"

        - name: Update CR work notes - pre health check completed
          uri:
            url: "{{ snow_instance }}/api/now/table/change_request/{{ hostvars['localhost']['cr_sys_id'] }}"
            method: PATCH
            user: "{{ snow_username }}"
            password: "{{ snow_password }}"
            force_basic_auth: yes
            validate_certs: yes
            headers:
              Content-Type: "application/json"
              Accept: "application/json"
            body_format: json
            body:
              work_notes: |
                Pre-health check completed before patching.

                Server: {{ inventory_hostname }}
                CPU Usage: {{ pre_health.cpu }}%
                Memory Usage: {{ pre_health.memory }}%
                Disk Usage: {{ pre_health.disk }}%
                Uptime: {{ pre_health.uptime }}
                Kernel Version: {{ pre_health.kernel }}
          delegate_to: localhost
          become: false

        #################################################################
        # PATCHING
        #################################################################

        - name: Update apt package cache
          apt:
            update_cache: yes
            cache_valid_time: 3600

        - name: Upgrade installed packages
          apt:
            upgrade: dist

        - name: Check if reboot required
          stat:
            path: /var/run/reboot-required
          register: reboot_required

        - name: Reboot server if required
          reboot:
            msg: "Rebooting after patching"
            reboot_timeout: 300
          when: reboot_required.stat.exists

        - name: Wait for connection after reboot
          wait_for_connection:
            timeout: 300
            delay: 10
          when: reboot_required.stat.exists

        #################################################################
        # POST HEALTH CHECK
        #################################################################

        - name: Post health check - CPU usage percentage
          shell: "vmstat 1 2 | tail -1 | awk '{print 100 - $15}'"
          register: post_cpu
          changed_when: false

        - name: Post health check - Memory usage percentage
          shell: "free | awk '/Mem:/ {printf \"%.2f\", $3/$2 * 100}'"
          register: post_memory
          changed_when: false

        - name: Post health check - Disk usage percentage for root
          shell: "df -P / | awk 'NR==2 {gsub(\"%\", \"\", $5); print $5}'"
          register: post_disk
          changed_when: false

        - name: Post health check - Uptime
          command: uptime -p
          register: post_uptime
          changed_when: false

        - name: Post health check - Kernel version
          command: uname -r
          register: post_kernel
          changed_when: false

        - name: Store post health values
          set_fact:
            post_health:
              cpu: "{{ post_cpu.stdout | default('0') }}"
              memory: "{{ post_memory.stdout | default('0') }}"
              disk: "{{ post_disk.stdout | default('0') }}"
              uptime: "{{ post_uptime.stdout | default('N/A') }}"
              kernel: "{{ post_kernel.stdout | default('N/A') }}"

        #################################################################
        # COMPARE PRE AND POST HEALTH
        #################################################################

        - name: Compare pre and post health values
          set_fact:
            cpu_difference: "{{ (post_health.cpu | float) - (pre_health.cpu | float) }}"
            memory_difference: "{{ (post_health.memory | float) - (pre_health.memory | float) }}"
            disk_difference: "{{ (post_health.disk | int) - (pre_health.disk | int) }}"

        - name: Set final health status
          set_fact:
            health_status: >-
              {{
                'PASSED'
                if
                (post_health.cpu | float) < 90 and
                (post_health.memory | float) < 90 and
                (post_health.disk | int) < 90
                else
                'FAILED'
              }}

        - name: Save patching report on target
          copy:
            dest: /tmp/patching_result.log
            content: |
              Change Request: {{ hostvars['localhost']['cr_number'] }}
              Server: {{ inventory_hostname }}
              Instance ID: {{ ec2_instance_id }}
              AMI Backup ID: {{ ami_backup.image_id }}

              Patch Status: Completed
              Health Status: {{ health_status }}
              Reboot Required: {{ reboot_required.stat.exists }}

              -------- PRE HEALTH CHECK --------
              CPU Usage: {{ pre_health.cpu }}%
              Memory Usage: {{ pre_health.memory }}%
              Disk Usage: {{ pre_health.disk }}%
              Uptime: {{ pre_health.uptime }}
              Kernel Version: {{ pre_health.kernel }}

              -------- POST HEALTH CHECK --------
              CPU Usage: {{ post_health.cpu }}%
              Memory Usage: {{ post_health.memory }}%
              Disk Usage: {{ post_health.disk }}%
              Uptime: {{ post_health.uptime }}
              Kernel Version: {{ post_health.kernel }}

              -------- COMPARISON --------
              CPU Difference: {{ cpu_difference }}%
              Memory Difference: {{ memory_difference }}%
              Disk Difference: {{ disk_difference }}%

        - name: Update CR work notes - post health comparison completed
          uri:
            url: "{{ snow_instance }}/api/now/table/change_request/{{ hostvars['localhost']['cr_sys_id'] }}"
            method: PATCH
            user: "{{ snow_username }}"
            password: "{{ snow_password }}"
            force_basic_auth: yes
            validate_certs: yes
            headers:
              Content-Type: "application/json"
              Accept: "application/json"
            body_format: json
            body:
              work_notes: |
                Post-health check and comparison completed.

                Server: {{ inventory_hostname }}
                Instance ID: {{ ec2_instance_id }}
                AMI Backup ID: {{ ami_backup.image_id }}
                Reboot Required: {{ reboot_required.stat.exists }}

                Health Status: {{ health_status }}

                Pre Health:
                - CPU Usage: {{ pre_health.cpu }}%
                - Memory Usage: {{ pre_health.memory }}%
                - Disk Usage: {{ pre_health.disk }}%
                - Uptime: {{ pre_health.uptime }}
                - Kernel Version: {{ pre_health.kernel }}

                Post Health:
                - CPU Usage: {{ post_health.cpu }}%
                - Memory Usage: {{ post_health.memory }}%
                - Disk Usage: {{ post_health.disk }}%
                - Uptime: {{ post_health.uptime }}
                - Kernel Version: {{ post_health.kernel }}

                Comparison:
                - CPU Difference: {{ cpu_difference }}%
                - Memory Difference: {{ memory_difference }}%
                - Disk Difference: {{ disk_difference }}%
          delegate_to: localhost
          become: false

        - name: Fail if post health check failed
          fail:
            msg: "Post health check failed on {{ inventory_hostname }}. Rollback will be attempted."
          when: health_status == "FAILED"

        - name: Update CR work notes - patch success
          uri:
            url: "{{ snow_instance }}/api/now/table/change_request/{{ hostvars['localhost']['cr_sys_id'] }}"
            method: PATCH
            user: "{{ snow_username }}"
            password: "{{ snow_password }}"
            force_basic_auth: yes
            validate_certs: yes
            headers:
              Content-Type: "application/json"
              Accept: "application/json"
            body_format: json
            body:
              work_notes: |
                Patching completed successfully.

                Server: {{ inventory_hostname }}
                Instance ID: {{ ec2_instance_id }}
                AMI Backup ID: {{ ami_backup.image_id }}
                Final Health Status: {{ health_status }}
                Rollback Required: No
          delegate_to: localhost
          become: false

      rescue:

        - name: Update CR work notes - patch or health check failed
          uri:
            url: "{{ snow_instance }}/api/now/table/change_request/{{ hostvars['localhost']['cr_sys_id'] }}"
            method: PATCH
            user: "{{ snow_username }}"
            password: "{{ snow_password }}"
            force_basic_auth: yes
            validate_certs: yes
            headers:
              Content-Type: "application/json"
              Accept: "application/json"
            body_format: json
            body:
              work_notes: |
                Patching or health check failed on {{ inventory_hostname }}.

                Rollback will be attempted only if AMI backup and EC2 details are available.
          delegate_to: localhost
          become: false

        - name: Launch rollback instance from AMI
          amazon.aws.ec2_instance:
            name: "rollback-{{ hostvars['localhost']['cr_number'] }}-{{ inventory_hostname }}"
            image_id: "{{ ami_backup.image_id }}"
            instance_type: "{{ ec2_instance_type }}"
            key_name: "{{ ec2_key_name }}"
            region: "{{ aws_region }}"
            vpc_subnet_id: "{{ ec2_subnet_id }}"
            security_groups:
              - "{{ ec2_security_group_id }}"
            wait: yes
            state: running
            tags:
              Name: "Rollback-{{ inventory_hostname }}"
              ChangeRequest: "{{ hostvars['localhost']['cr_number'] }}"
              CreatedBy: "Ansible"
              Purpose: "Rollback"
          delegate_to: localhost
          become: false
          register: rollback_result
          when:
            - ami_backup is defined
            - ami_backup.image_id is defined
            - ec2_instance_type is defined
            - ec2_key_name is defined
            - ec2_subnet_id is defined
            - ec2_security_group_id is defined

        - name: Update CR work notes - rollback completed
          uri:
            url: "{{ snow_instance }}/api/now/table/change_request/{{ hostvars['localhost']['cr_sys_id'] }}"
            method: PATCH
            user: "{{ snow_username }}"
            password: "{{ snow_password }}"
            force_basic_auth: yes
            validate_certs: yes
            headers:
              Content-Type: "application/json"
              Accept: "application/json"
            body_format: json
            body:
              work_notes: |
                Rollback instance launched.

                Original Server: {{ inventory_hostname }}
                AMI Used: {{ ami_backup.image_id }}
                New Instance ID: {{ rollback_result.instances[0].instance_id | default('N/A') }}
                New Private IP: {{ rollback_result.instances[0].private_ip_address | default('N/A') }}
                New Public IP: {{ rollback_result.instances[0].public_ip_address | default('N/A') }}
          delegate_to: localhost
          become: false
          when:
            - rollback_result is defined
            - not rollback_result.skipped | default(false)
            - rollback_result.instances is defined
            - rollback_result.instances | length > 0

        - name: Update CR work notes - rollback skipped
          uri:
            url: "{{ snow_instance }}/api/now/table/change_request/{{ hostvars['localhost']['cr_sys_id'] }}"
            method: PATCH
            user: "{{ snow_username }}"
            password: "{{ snow_password }}"
            force_basic_auth: yes
            validate_certs: yes
            headers:
              Content-Type: "application/json"
              Accept: "application/json"
            body_format: json
            body:
              work_notes: |
                Rollback skipped.

                Server: {{ inventory_hostname }}
                Reason: AMI backup or required EC2 details were not available.
          delegate_to: localhost
          become: false
          when: rollback_result is not defined or rollback_result.skipped | default(false)

        - name: Fail after rollback
          fail:
            msg: "Patching failed on {{ inventory_hostname }}. Rollback checked. See ServiceNow work notes for details."
