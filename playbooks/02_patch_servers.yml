---
- name: Patch EC2 servers from ServiceNow CR
  hosts: patch_targets
  become: yes
  serial: 1
  gather_facts: yes

  vars_files:
    - ../inventory/group_vars/all.yml

  tasks:

    - name: Show current target
      debug:
        msg:
          - "Starting patching on {{ inventory_hostname }}"
          - "CR: {{ hostvars['localhost']['cr_number'] }}"
          - "Server Name: {{ server_name | default('N/A') }}"
          - "Application Owner: {{ application_owner_email | default('N/A') }}"

    - name: Get current server time
      command: date +"%H:%M"
      register: current_time
      changed_when: false

    - name: Stop if outside maintenance window
      fail:
        msg: "Outside maintenance window. Current time {{ current_time.stdout }}, allowed {{ hostvars['localhost']['maintenance_start'] | default('00:00') }} to {{ hostvars['localhost']['maintenance_end'] | default('23:59') }}"
      when: current_time.stdout < (hostvars['localhost']['maintenance_start'] | default('00:00')) or current_time.stdout > (hostvars['localhost']['maintenance_end'] | default('23:59'))

    - block:

        - name: Get EC2 details from CSV Instance ID
          include_tasks: tasks/01_ec2_details.yml

        - name: Run PRE health check
          include_tasks: tasks/03_pre_health_check.yml

        - name: Create AMI backup
          include_tasks: tasks/02_ami_backup.yml

        - name: Patch server
          include_tasks: tasks/04_patch_server.yml

        - name: Run POST health check and compare
          include_tasks: tasks/05_post_health_compare.yml

        - name: Update success details
          include_tasks: tasks/06_success_update.yml

      rescue:

        - name: Rollback and failure update
          include_tasks: tasks/99_rollback.yml
