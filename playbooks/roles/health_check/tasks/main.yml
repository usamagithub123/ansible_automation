# ================= CPU CHECK =================

- name: Get CPU usage using /proc/stat
  shell: |
    PREV_IDLE=$(awk '/^cpu / {print $5}' /proc/stat)
    PREV_TOTAL=$(awk '/^cpu / {print $2+$3+$4+$5+$6+$7+$8}' /proc/stat)
    sleep 1
    IDLE=$(awk '/^cpu / {print $5}' /proc/stat)
    TOTAL=$(awk '/^cpu / {print $2+$3+$4+$5+$6+$7+$8}' /proc/stat)
    DIFF_IDLE=$((IDLE-PREV_IDLE))
    DIFF_TOTAL=$((TOTAL-PREV_TOTAL))
    awk "BEGIN {printf \"%.2f\", (100 * ($DIFF_TOTAL - $DIFF_IDLE) / $DIFF_TOTAL)}"
  register: cpu_raw

- name: Debug CPU raw output
  debug:
    msg: "CPU RAW: {{ cpu_raw.stdout }}"

- name: Set CPU usage
  set_fact:
    cpu_usage: "{{ cpu_raw.stdout | default('0') | float }}"


# ================= MEMORY CHECK =================

- name: Get Memory usage
  shell: "free | awk '/Mem:/ {printf \"%.2f\", ($3/$2)*100}'"
  register: mem_raw

- name: Debug Memory raw output
  debug:
    msg: "MEM RAW: {{ mem_raw.stdout }}"

- name: Set Memory usage
  set_fact:
    memory_usage: "{{ mem_raw.stdout | default('0') | float }}"


# ================= DISK CHECK =================

- name: Get Disk usage
  shell: "df -h / | awk 'NR==2 {print $5}' | sed 's/%//'"
  register: disk_raw

- name: Debug Disk raw output
  debug:
    msg: "DISK RAW: {{ disk_raw.stdout }}"

- name: Set Disk usage
  set_fact:
    disk_usage: "{{ disk_raw.stdout | default('0') | float }}"


# ================= PRINT RESULTS =================

- name: Print results
  debug:
    msg:
      - "CPU Usage: {{ cpu_usage }}%"
      - "Memory Usage: {{ memory_usage }}%"
      - "Disk Usage: {{ disk_usage }}%"


# ================= HEALTH STATUS =================

- name: Set health status
  set_fact:
    health_status: >-
      {% if (cpu_usage | float) > 80 or (memory_usage | float) > 80 or (disk_usage | float) > 85 %}
      UNHEALTHY
      {% else %}
      HEALTHY
      {% endif %}

- name: Final status
  debug:
    msg: "Overall Status: {{ health_status }}"

