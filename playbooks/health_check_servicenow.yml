- name: Fetch RITM and server IP from ServiceNow variable
  hosts: localhost
  gather_facts: no

  vars_files:
    - ../inventory/group_vars/all.yml

  tasks:

    - name: Get latest Linux Health Check RITM
      uri:
        url: "https://{{ snow_instance }}/api/now/table/sc_req_item?sysparm_query=cat_item.name=Linux%20Health%20Check^active=true^ORDERBYDESCsys_created_on&sysparm_limit=1"
        method: GET
        user: "{{ snow_username }}"
        password: "{{ snow_password }}"
        force_basic_auth: yes
        return_content: yes
      register: snow_data

    - name: Show selected RITM
      debug:
        msg:
          - "RITM Number: {{ snow_data.json.result[0].number }}"
          - "RITM Sys ID: {{ snow_data.json.result[0].sys_id }}"

    - name: Extract RITM sys_id
      set_fact:
        ritm_sys_id: "{{ snow_data.json.result[0].sys_id }}"

    - name: Get catalog variable link records
      uri:
        url: "https://{{ snow_instance }}/api/now/table/sc_item_option_mtom?sysparm_query=request_item={{ ritm_sys_id }}&sysparm_display_value=all"
        method: GET
        user: "{{ snow_username }}"
        password: "{{ snow_password }}"
        force_basic_auth: yes
        return_content: yes
      register: var_links

    - name: Stop if no variable links found
      fail:
        msg: "No catalog variables found in this RITM"
      when: var_links.json.result | length == 0

    - name: Fetch actual variable option records
      uri:
        url: "https://{{ snow_instance }}/api/now/table/sc_item_option/{{ item.sc_item_option.value }}?sysparm_display_value=all"
        method: GET
        user: "{{ snow_username }}"
        password: "{{ snow_password }}"
        force_basic_auth: yes
        return_content: yes
      loop: "{{ var_links.json.result }}"
      register: option_records

    - name: Extract server IP from variable data
      set_fact:
        target_ip: "{{ option_records.results | to_json | regex_search('([0-9]{1,3}\\.){3}[0-9]{1,3}') | default('') }}"

    - name: Show target IP
      debug:
        msg: "✅ Target Server IP from ServiceNow: {{ target_ip | default('NOT_FOUND') }}"

    - name: Fail if no IP found
      fail:
        msg: "❌ enter_server_ip variable not found in ServiceNow"
      when: target_ip == ""

    # ✅ Use PUBLIC IP for connection (stable)
    - name: Add dynamic host
      add_host:
        name: dynamic_target
        ansible_host: "13.60.183.2"
        ansible_user: ubuntu
        ansible_ssh_private_key_file: ~/.ssh/id_ed25519

# =====================================

- name: Run Health Check
  hosts: dynamic_target
  become: yes

  roles:
    - health_check

  tasks:

    - name: Set health status
      set_fact:
        health_status: "SUCCESS"

    - name: Update result to ServiceNow
      uri:
        url: "https://{{ snow_instance }}/api/now/table/sc_req_item/{{ hostvars['localhost']['ritm_sys_id'] }}"
        method: PATCH
        user: "{{ snow_username }}"
        password: "{{ snow_password }}"
        force_basic_auth: yes
        headers:
          Content-Type: "application/json"
        body_format: json
        body:
          comments: "✅ Health Check Completed - {{ health_status }}"
      delegate_to: localhost
