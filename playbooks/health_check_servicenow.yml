- name: Fetch RITM and server IP from ServiceNow variable
  hosts: localhost
  gather_facts: no

  vars_files:
    - ../inventory/group_vars/all.yml

  vars:
    snow_query: "active=true^ORDERBYDESCsys_created_on"

  tasks:

    - name: Get latest Linux Health Check RITM
      uri:
        url: "https://{{ snow_instance }}/api/now/table/sc_req_item?sysparm_query={{ snow_query | urlencode }}&sysparm_limit=1"
        method: GET
        user: "{{ snow_username }}"
        password: "{{ snow_password }}"
        force_basic_auth: yes
        return_content: yes
        status_code: 200
      register: snow_data

    - name: Debug RITM response
      debug:
        var: snow_data.json

    - name: Fail if no RITM found
      fail:
        msg: "No active RITM found in ServiceNow."
      when: snow_data.json.result | length == 0

    - name: Extract RITM details
      set_fact:
        ritm_sys_id: "{{ snow_data.json.result[0].sys_id }}"
        ritm_number: "{{ snow_data.json.result[0].number }}"

    - name: Show selected RITM
      debug:
        msg:
          - "RITM Number: {{ ritm_number }}"
          - "RITM Sys ID: {{ ritm_sys_id }}"

    - name: Get catalog variable link records
      uri:
        url: "https://{{ snow_instance }}/api/now/table/sc_item_option_mtom?sysparm_query=request_item={{ ritm_sys_id }}&sysparm_display_value=all"
        method: GET
        user: "{{ snow_username }}"
        password: "{{ snow_password }}"
        force_basic_auth: yes
        return_content: yes
        status_code: 200
      register: var_links

    - name: Debug variable link records
      debug:
        var: var_links.json.result

    - name: Fail if no variable links found
      fail:
        msg: "No catalog variables found for this RITM."
      when: var_links.json.result | length == 0

    - name: Fetch actual variable option records
      uri:
        url: "https://{{ snow_instance }}/api/now/table/sc_item_option/{{ item.sc_item_option.value }}?sysparm_display_value=all"
        method: GET
        user: "{{ snow_username }}"
        password: "{{ snow_password }}"
        force_basic_auth: yes
        return_content: yes
        status_code: 200
      loop: "{{ var_links.json.result }}"
      register: option_records

    - name: Debug actual variable values
      debug:
        var: option_records.results

    - name: Extract server IP from ServiceNow variables
      set_fact:
        target_ip: "{{ option_records.results | to_json | regex_search('([0-9]{1,3}\\.){3}[0-9]{1,3}') | default('') }}"

    - name: Show target IP
      debug:
        msg: "Target Server IP from ServiceNow: {{ target_ip | default('NOT_FOUND') }}"

    - name: Fail if server IP variable not found
      fail:
        msg: "enter_server_ip value was not found in ServiceNow variable records."
      when: target_ip == ""

    - name: Add dynamic host using EC2 public IP
      add_host:
        name: dynamic_target
        ansible_host: "13.60.183.2"
        ansible_user: ubuntu
        ansible_ssh_private_key_file: ~/.ssh/id_ed25519


- name: Run Health Check
  hosts: dynamic_target
  gather_facts: yes
  become: yes

  vars_files:
    - ../inventory/group_vars/all.yml

  roles:
    - health_check

  tasks:

    - name: Set health status
      set_fact:
        health_status: "SUCCESS"

    - name: Update result to ServiceNow
      uri:
        url: "https://{{ snow_instance }}/api/now/table/sc_req_item/{{ hostvars['localhost']['ritm_sys_id'] }}"
        method: PATCH
        user: "{{ snow_username }}"
        password: "{{ snow_password }}"
        force_basic_auth: yes
        headers:
          Content-Type: "application/json"
        body_format: json
        body:
          comments: "Health Check Completed - {{ health_status }}"
        status_code:
          - 200
          - 204
      delegate_to: localhost
