---
- name: Fetch latest ServiceNow CR and read servers from CSV
  hosts: localhost
  gather_facts: no
  become: false

  vars:
    snow_instance: "https://nowlearning-nlinst04289212-3puxr-0001.lab.service-now.com"
    snow_username: "admin"
    snow_password: "9JSCJPNZqpgj"
    snow_cr_keyword: "AUTOMATED_PATCHING_DEMO"

    target_ssh_user: "ubuntu"
    target_python: "/usr/bin/python3"

    maintenance_start: "00:00"
    maintenance_end: "23:59"

  tasks:

    - name: Fetch latest Change Request using keyword from Description
      uri:
        url: "{{ snow_instance }}/api/now/table/change_request?sysparm_query=descriptionLIKE{{ snow_cr_keyword }}^ORDERBYDESCsys_created_on&sysparm_limit=1&sysparm_display_value=true"
        method: GET
        user: "{{ snow_username }}"
        password: "{{ snow_password }}"
        force_basic_auth: yes
        validate_certs: yes
        return_content: yes
        headers:
          Accept: "application/json"
      register: snow_cr_response

    - name: Fail if no CR found with keyword
      fail:
        msg: "No Change Request found with keyword '{{ snow_cr_keyword }}' in Description"
      when: snow_cr_response.json.result | length == 0

    - name: Store CR details
      set_fact:
        cr_record: "{{ snow_cr_response.json.result[0] }}"
        cr_sys_id: "{{ snow_cr_response.json.result[0].sys_id }}"
        cr_number: "{{ snow_cr_response.json.result[0].number }}"
        cr_description: "{{ snow_cr_response.json.result[0].description | default('') }}"
        maintenance_start: "{{ maintenance_start }}"
        maintenance_end: "{{ maintenance_end }}"

    - name: Read server owner details from CSV
      community.general.read_csv:
        path: "{{ playbook_dir }}/../inventory/server_owner_details.csv"
      register: server_csv

    - name: Fail if CSV file is empty
      fail:
        msg: "server_owner_details.csv is empty or not readable"
      when: server_csv.list | length == 0

    - name: Store server rows from CSV
      set_fact:
        server_rows: "{{ server_csv.list }}"

    - name: Fail if server IP is missing in Cluster Details
      fail:
        msg: "Missing ip= value in Cluster Details for server {{ item['Server Name'] }}"
      when: (item['Cluster Details'] | regex_findall('ip=([^\\s|]+)') | length) == 0
      loop: "{{ server_rows }}"

    - name: Show servers loaded from CSV
      debug:
        msg:
          - "CR Number: {{ cr_number }}"
          - "Servers loaded from CSV: {{ server_rows | length }}"

    - name: Add CSV servers dynamically to patch_targets group
      add_host:
        name: "{{ item['Cluster Details'] | regex_findall('ip=([^\\s|]+)') | first }}"
        groups: patch_targets
        ansible_connection: ssh
        ansible_user: "{{ target_ssh_user }}"
        ansible_python_interpreter: "{{ target_python }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no"

        server_name: "{{ item['Server Name'] }}"
        ec2_instance_id_from_csv: "{{ item['Server ID'] }}"
        application_owner_name: "{{ item['Application Owner Name'] }}"
        application_owner_email: "{{ item['Application Owner Details'] }}"
        cluster_details: "{{ item['Cluster Details'] }}"
      loop: "{{ server_rows }}"

    - name: Prepare unique application owner email list
      set_fact:
        application_owner_emails: "{{ server_rows | map(attribute='Application Owner Details') | unique | list }}"

    - name: Show email recipients
      debug:
        msg: "Patch start email will be sent to: {{ application_owner_emails | join(',') }}"

    - name: Send patch start email to application owner
      community.general.mail:
        host: "{{ smtp_host }}"
        port: "{{ smtp_port }}"
        username: "{{ smtp_username }}"
        password: "{{ smtp_password }}"
        to: "{{ application_owner_emails | join(',') }}"
        from: "{{ email_from }}"
        subject: "Patch Automation Started - {{ cr_number }}"
        subtype: plain
        body: |
          Hello Team,

          Patch automation has started.

          Change Request: {{ cr_number }}
          Server Source: inventory/server_owner_details.csv

          Servers planned for patching:
          {% for server in server_rows %}
          - Server Name: {{ server['Server Name'] }}
            Instance ID: {{ server['Server ID'] }}
            Owner: {{ server['Application Owner Details'] }}
            Details: {{ server['Cluster Details'] }}
          {% endfor %}

          Automation Steps:
          - AMI backup before patching
          - Pre-health check
          - Server patching
          - Post-health check
          - Pre vs Post health comparison
          - ServiceNow work notes update

          Regards,
          Ansible Automation Platform
        secure: starttls
      delegate_to: localhost
      become: false

    - name: Update CR work notes - email sent to application owner
      uri:
        url: "{{ snow_instance }}/api/now/table/change_request/{{ cr_sys_id }}"
        method: PATCH
        user: "{{ snow_username }}"
        password: "{{ snow_password }}"
        force_basic_auth: yes
        validate_certs: yes
        headers:
          Content-Type: "application/json"
          Accept: "application/json"
        body_format: json
        body:
          work_notes: |
            Patch start email sent to application owner.

            Email Sent To: {{ application_owner_emails | join(',') }}
            CR Number: {{ cr_number }}
            Server Source: inventory/server_owner_details.csv
      delegate_to: localhost
      become: false

    - name: Update CR work notes - automation started with CSV servers
      uri:
        url: "{{ snow_instance }}/api/now/table/change_request/{{ cr_sys_id }}"
        method: PATCH
        user: "{{ snow_username }}"
        password: "{{ snow_password }}"
        force_basic_auth: yes
        validate_certs: yes
        headers:
          Content-Type: "application/json"
          Accept: "application/json"
        body_format: json
        body:
          work_notes: |
            Ansible patching automation started.

            CR fetched dynamically using keyword: {{ snow_cr_keyword }}
            CR Number: {{ cr_number }}
            Server source: inventory/server_owner_details.csv
            Total servers loaded from CSV: {{ server_rows | length }}

            Servers:
            {% for server in server_rows %}
            - {{ server['Server Name'] }} | Instance ID: {{ server['Server ID'] }} | Owner: {{ server['Application Owner Details'] }} | {{ server['Cluster Details'] }}
            {% endfor %}
      delegate_to: localhost
      become: false
