---
- name: Fetch latest ServiceNow CR by keyword and create dynamic inventory
  hosts: localhost
  gather_facts: no
  become : false

  tasks:

    - name: Fetch latest Change Request using keyword from Description
      uri:
        url: "{{ snow_instance }}/api/now/table/change_request?sysparm_query=descriptionLIKE{{ snow_cr_keyword }}^ORDERBYDESCsys_created_on&sysparm_limit=1&sysparm_display_value=true"
        method: GET
        user: "{{ snow_username }}"
        password: "{{ snow_password }}"
        force_basic_auth: yes
        validate_certs: yes
        return_content: yes
        headers:
          Accept: "application/json"
      register: snow_cr_response

    - name: Fail if no CR found with keyword
      fail:
        msg: "No Change Request found with keyword '{{ snow_cr_keyword }}' in Description"
      when: snow_cr_response.json.result | length == 0

    - name: Store CR details
      set_fact:
        cr_record: "{{ snow_cr_response.json.result[0] }}"
        cr_sys_id: "{{ snow_cr_response.json.result[0].sys_id }}"
        cr_number: "{{ snow_cr_response.json.result[0].number }}"
        cr_description: "{{ snow_cr_response.json.result[0].description | default('') }}"

    - name: Extract target servers from CR description
      set_fact:
        target_servers_raw: "{{ (cr_description | regex_findall('(?im)^\\s*Target servers\\s*=\\s*([^\\r\\n]+)') | first) | default('') }}"

    - name: Extract maintenance window from CR description
      set_fact:
        maintenance_window_raw: "{{ (cr_description | regex_findall('(?im)^\\s*Maintenance window\\s*=\\s*([^\\r\\n]+)') | first) | default('00:00 to 23:59') }}"

    - name: Extract patch type from CR description
      set_fact:
        patch_type: "{{ (cr_description | regex_findall('(?im)^\\s*Patch type\\s*=\\s*([^\\r\\n]+)') | first) | default('full') }}"

    - name: Extract rollback required value from CR description
      set_fact:
        rollback_required: "{{ (cr_description | regex_findall('(?im)^\\s*Rollback required\\s*=\\s*([^\\r\\n]+)') | first) | default('true') }}"

    - name: Split maintenance window into start and end time
      set_fact:
        maintenance_start: "{{ maintenance_window_raw.split('to')[0] | trim }}"
        maintenance_end: "{{ (maintenance_window_raw.split('to')[1] | trim) if ('to' in maintenance_window_raw) else '23:59' }}"

    - name: Convert target servers string into list
      set_fact:
        target_servers: "{{ target_servers_raw.split(',') | map('trim') | reject('equalto', '') | list }}"

    - name: Fail if target servers are missing
      fail:
        msg: "No Target servers found in CR Description. Add: Target servers = 172.31.40.87,172.31.43.241"
      when: target_servers | length == 0

    - name: Show extracted CR values
      debug:
        msg:
          - "Fetched CR dynamically using keyword: {{ snow_cr_keyword }}"
          - "CR Number: {{ cr_number }}"
          - "Target Servers: {{ target_servers }}"
          - "Maintenance Window: {{ maintenance_start }} to {{ maintenance_end }}"
          - "Patch Type: {{ patch_type }}"
          - "Rollback Required: {{ rollback_required }}"

    - name: Add target servers dynamically to Ansible group
      add_host:
        name: "{{ item }}"
        groups: patch_targets
        ansible_user: "{{ target_ssh_user }}"
        ansible_python_interpreter: "{{ target_python }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
      loop: "{{ target_servers }}"

    - name: Update CR work notes - automation started
      uri:
        url: "{{ snow_instance }}/api/now/table/change_request/{{ cr_sys_id }}"
        method: PATCH
        user: "{{ snow_username }}"
        password: "{{ snow_password }}"
        force_basic_auth: yes
        validate_certs: yes
        headers:
          Content-Type: "application/json"
          Accept: "application/json"
        body_format: json
        body:
          work_notes: |
            Ansible patching automation started.
            CR fetched dynamically using keyword: {{ snow_cr_keyword }}
            CR Number: {{ cr_number }}
            Target Servers: {{ target_servers | join(', ') }}
            Maintenance Window: {{ maintenance_start }} to {{ maintenance_end }}
            Patch Type: {{ patch_type }}
            Rollback Required: {{ rollback_required }}
