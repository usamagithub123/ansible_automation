---
- name: Decommission EC2
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    instance_id: "{{ target_instance }}"
    aws_region: "eu-north-1"

  tasks:

    - name: Stop EC2
      amazon.aws.ec2_instance:
        instance_ids:
          - "{{ instance_id }}"
        region: "{{ aws_region }}"
        state: stopped

    - name: Terminate EC2
      amazon.aws.ec2_instance:
        instance_ids:
          - "{{ instance_id }}"
        region: "{{ aws_region }}"
        state: absent
